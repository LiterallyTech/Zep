<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: arial, sans-serif;
        margin: 0;
        background-color: #fff;
        color: #202124;
    }
    a { text-decoration: none; color: #1a0dab; }
    a:visited { color: #681da8; }
    a:hover { text-decoration: underline; }

    /* Header Navigation */
    .header-nav {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        padding: 6px 15px;
        font-size: 13px;
        gap: 15px;
    }
    .header-nav a {
        color: rgba(0,0,0,.87);
        padding: 5px;
    }
    .header-nav a:hover {
        text-decoration: underline;
    }
    .sign-in-btn {
        background: #1a73e8;
        color: #fff;
        border: none;
        padding: 9px 23px;
        border-radius: 4px;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        margin-left: 8px;
    }
    .sign-in-btn:hover {
        background: #1765cc;
        box-shadow: 0 1px 2px 0 rgba(66,133,244,0.3), 0 1px 3px 1 rgba(66,133,244,0.15);
    }

    /* Homepage */
    #home {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 150px);
        padding-bottom: 100px;
    }
    .logo {
        margin-bottom: 25px;
    }
    .logo-text {
        font-size: 90px;
        font-weight: 400;
        letter-spacing: -5px;
        display: inline-block;
    }
    .logo-g { color: #4285f4; }
    .logo-o1 { color: #ea4335; }
    .logo-o2 { color: #fbbc04; }
    .logo-g2 { color: #4285f4; }
    .logo-l { color: #34a853; }
    .logo-e { color: #ea4335; }

    .search-box {
        width: 584px;
        max-width: 90%;
        position: relative;
        margin: 0 auto;
    }
    .search-icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 20px;
        height: 20px;
        opacity: 0.54;
    }
    .mic-icon {
        position: absolute;
        right: 48px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        padding: 8px;
    }
    .camera-icon {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        padding: 8px;
    }
    #searchInput, #resultSearchInput {
        width: 100%;
        padding: 13px 52px 13px 46px;
        font-size: 16px;
        border-radius: 24px;
        border: 1px solid #dfe1e5;
        outline: none;
        transition: box-shadow 0.2s ease-in-out, border-color 0.2s;
    }
    #searchInput:hover, #resultSearchInput:hover {
        box-shadow: 0 1px 6px rgba(32,33,36,.28);
        border-color: rgba(223,225,229,0);
    }
    #searchInput:focus, #resultSearchInput:focus {
        box-shadow: 0 1px 6px rgba(32,33,36,.28);
        border-color: rgba(223,225,229,0);
    }
    .buttons { 
        margin-top: 28px; 
        display: flex;
        gap: 10px;
        justify-content: center;
    }
    button {
        padding: 10px 16px;
        border-radius: 4px;
        border: 1px solid transparent;
        background-color: #f8f9fa;
        cursor: pointer;
        font-size: 14px;
        color: #3c4043;
        height: 36px;
        min-width: 54px;
        font-family: arial, sans-serif;
    }
    button:hover { 
        box-shadow: 0 1px 1px rgba(0,0,0,.1);
        border: 1px solid #dadce0;
        color: #202124;
    }

    /* Results Page */
    #results { 
        display: none; 
        padding: 0;
        min-height: 100vh;
    }
    .results-header {
        border-bottom: 1px solid #ebebeb;
        padding: 12px 180px 0;
    }
    .results-top {
        display: flex;
        align-items: center;
        gap: 30px;
        margin-bottom: 16px;
    }
    .results-logo {
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -1px;
        cursor: pointer;
        display: flex;
    }
    .results-search-box {
        flex: 1;
        max-width: 692px;
        position: relative;
    }
    #resultSearchInput {
        width: 100%;
        padding: 10px 52px 10px 46px;
        font-size: 14px;
        border-radius: 24px;
    }
    .results-search-box .search-icon {
        width: 18px;
        height: 18px;
        left: 16px;
    }
    .results-search-box .mic-icon,
    .results-search-box .camera-icon {
        right: auto;
        padding: 6px;
    }
    .results-search-box .mic-icon {
        right: 42px;
    }
    .results-search-box .camera-icon {
        right: 12px;
    }
    .search-btn {
        position: absolute;
        right: -80px;
        top: 50%;
        transform: translateY(-50%);
        background: #f8f9fa;
        border: 1px solid #f8f9fa;
        color: #3c4043;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
    }
    .search-btn:hover {
        box-shadow: 0 1px 1px rgba(0,0,0,.1);
        border: 1px solid #dadce0;
    }

    .results-content {
        padding: 12px 180px;
    }
    .results-info {
        color: #70757a;
        font-size: 14px;
        margin-bottom: 20px;
    }
    .result-item { 
        margin-bottom: 30px;
        max-width: 600px;
    }
    .result-item .url-line {
        display: flex;
        align-items: center;
        margin-bottom: 5px;
    }
    .result-item .favicon {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f1f3f4;
        margin-right: 12px;
    }
    .result-item .url { 
        font-size: 14px;
        color: #202124;
        line-height: 1.3;
    }
    .result-item .breadcrumb {
        color: #5f6368;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 5px;
    }
    .result-item h3 {
        margin: 0 0 3px 0;
        font-size: 20px;
        line-height: 1.3;
        font-weight: 400;
    }
    .result-item h3 a {
        color: #1a0dab;
    }
    .result-item h3 a:visited {
        color: #681da8;
    }
    .result-item h3 a:hover {
        text-decoration: underline;
    }
    .result-item .date {
        color: #70757a;
        font-size: 14px;
        margin-bottom: 8px;
    }
    .result-item p { 
        font-size: 14px;
        color: #4d5156;
        line-height: 1.58;
        margin: 0;
    }

    /* Pagination */
    .pagination { 
        margin: 30px 0 60px; 
        text-align: center; 
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }
    .pagination a { 
        color: #1a73e8;
        text-decoration: none;
        padding: 8px 12px;
        display: inline-block;
        min-width: 36px;
        text-align: center;
    }
    .pagination a:hover { 
        background-color: transparent;
        text-decoration: underline;
    }
    .pagination .current { 
        font-weight: 400;
        color: #202124;
        pointer-events: none;
        padding: 8px 12px;
        display: inline-block;
    }
    .pagination .nav-arrow {
        padding: 8px;
    }

    /* Footer */
    footer { 
        background: #f2f2f2;
        border-top: 1px solid #e4e4e4;
        margin-top: auto;
    }
    .footer-country {
        padding: 15px 30px;
        border-bottom: 1px solid #dadce0;
        font-size: 15px;
        color: #70757a;
    }
    .footer-links {
        padding: 15px 20px;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        font-size: 14px;
    }
    .footer-links a { 
        color: #70757a;
        padding: 10px;
    }
    .footer-links a:hover {
        text-decoration: underline;
    }
    .footer-left, .footer-right {
        display: flex;
        gap: 5px;
    }

    @media (max-width: 1024px) {
        .results-header, .results-content {
            padding-left: 40px;
            padding-right: 40px;
        }
    }
</style>
</head>
<body>

<!-- Homepage -->
<div id="home">
    <div class="header-nav">
        <a href="#">Gmail</a>
        <a href="#">Images</a>
        <button class="sign-in-btn">Sign in</button>
    </div>
    
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div class="logo">
            <span class="logo-text">
                <span class="logo-g">G</span><span class="logo-o1">o</span><span class="logo-o2">o</span><span class="logo-g2">g</span><span class="logo-l">l</span><span class="logo-e">e</span>
            </span>
        </div>
        <div class="search-box">
            <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" id="searchInput" placeholder="">
            <svg class="mic-icon" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path><path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path><path fill="#fbbc04" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"></path><path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"></path></svg>
            <svg class="camera-icon" focusable="false" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg" width="24" height="24"><rect fill="none" height="192" width="192"></rect><g><circle fill="#34a853" cx="144.07" cy="144" r="16"></circle><circle fill="#4285f4" cx="96.07" cy="104" r="24"></circle><path fill="#ea4335" d="M24,135.2c0,18.11,14.69,32.8,32.8,32.8H96v-16l-40.1-0.1c-8.8,0-15.9-8.19-15.9-17.9v-18H24V135.2z"></path><path fill="#fbbc04" d="M168,72.8c0-18.11-14.69-32.8-32.8-32.8H116l20,16c8.8,0,16,8.29,16,18v30h16V72.8z"></path><path fill="#4285f4" d="M112,24l-32,0L68,40H56.8C38.69,40,24,54.69,24,72.8V92h16V74c0-9.71,7.2-18,16-18h80L112,24z"></path></g></svg>
        </div>
        <div class="buttons">
            <button onclick="doSearchFromHome()">Google Search</button>
        </div>
    </div>
    
    <footer>
        <div class="footer-country" id="country">United States</div>
        <div class="footer-links">
            <div class="footer-left">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>
</div>

<!-- Results Page -->
<div id="results">
    <div class="results-header">
        <div class="results-top">
            <div class="results-logo" onclick="goHome()">
                <span class="logo-g">G</span><span class="logo-o1">o</span><span class="logo-o2">o</span><span class="logo-g2">g</span><span class="logo-l">l</span><span class="logo-e">e</span>
            </div>
            <div class="results-search-box">
                <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                <input type="text" id="resultSearchInput">
                <svg class="mic-icon" focusable="false" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20"><path fill="#4285f4" d="m12 15c1.66 0 3-1.31 3-2.97v-7.02c0-1.66-1.34-3.01-3-3.01s-3 1.34-3 3.01v7.02c0 1.66 1.34 2.97 3 2.97z"></path><path fill="#34a853" d="m11 18.08h2v3.92h-2z"></path><path fill="#fbbc04" d="m7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h2c0 1.45 0.56 2.42 1.47 3.38v0.32l-1.15 1.18z"></path><path fill="#ea4335" d="m12 16.93a4.97 5.25 0 0 1 -3.54 -1.55l-1.41 1.49c1.26 1.34 3.02 2.13 4.95 2.13 3.87 0 6.99-2.92 6.99-7h-1.99c0 2.92-2.24 4.93-5 4.93z"></path></svg>
                <svg class="camera-icon" focusable="false" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg" width="20" height="20"><rect fill="none" height="192" width="192"></rect><g><circle fill="#34a853" cx="144.07" cy="144" r="16"></circle><circle fill="#4285f4" cx="96.07" cy="104" r="24"></circle><path fill="#ea4335" d="M24,135.2c0,18.11,14.69,32.8,32.8,32.8H96v-16l-40.1-0.1c-8.8,0-15.9-8.19-15.9-17.9v-18H24V135.2z"></path><path fill="#fbbc04" d="M168,72.8c0-18.11-14.69-32.8-32.8-32.8H116l20,16c8.8,0,16,8.29,16,18v30h16V72.8z"></path><path fill="#4285f4" d="M112,24l-32,0L68,40H56.8C38.69,40,24,54.69,24,72.8V92h16V74c0-9.71,7.2-18,16-18h80L112,24z"></path></g></svg>
                <button class="search-btn" onclick="doSearchFromResults()">Search</button>
            </div>
        </div>
    </div>
    
    <div class="results-content">
        <div id="resultsContainer"></div>
        <div class="pagination" id="pagination"></div>
    </div>
    
    <footer>
        <div class="footer-country">United States</div>
        <div class="footer-links">
            <div class="footer-left">
                <a href="#">About</a>
                <a href="#">Advertising</a>
                <a href="#">Business</a>
                <a href="#">How Search works</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Settings</a>
            </div>
        </div>
    </footer>
</div>

<script>
// Demo search backend
const demoResults = [];
const domains = ['wikipedia.org', 'github.com', 'stackoverflow.com', 'medium.com', 'reddit.com', 'youtube.com', 'twitter.com', 'linkedin.com', 'amazon.com', 'nytimes.com'];
const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];

for (let i = 1; i <= 50; i++) {
    const domain = domains[i % domains.length];
    const day = Math.floor(Math.random() * 28) + 1;
    const month = months[Math.floor(Math.random() * 10)];
    const year = 2025;
    demoResults.push({
        title: `Demo Result Title ${i} - Information and Resources`,
        url: `https://www.${domain}/page-${i}`,
        domain: domain,
        snippet: `This is a comprehensive demo snippet for result ${i}. It contains relevant information about the search query and provides useful context for users looking for specific information.`,
        date: `${month} ${day}, ${year}`
    });
}

let currentPage = 1;
const resultsPerPage = 10;

function detectLocale() {
    const lang = navigator.language || navigator.userLanguage || "en-US";
    const countryCode = lang.split('-')[1] || "US";
    const countryNames = {
        'US': 'United States', 'GB': 'United Kingdom', 'CA': 'Canada', 
        'AU': 'Australia', 'IN': 'India', 'DE': 'Germany', 'FR': 'France',
        'ES': 'Spain', 'IT': 'Italy', 'BR': 'Brazil', 'MX': 'Mexico',
        'JP': 'Japan', 'CN': 'China', 'KR': 'South Korea', 'RO': 'Romania'
    };
    const country = countryNames[countryCode] || countryCode;
    document.querySelectorAll('.footer-country, #country').forEach(el => el.innerText = country);
}

function goHome() {
    location.hash = '';
    document.getElementById('home').style.display = 'flex';
    document.getElementById('results').style.display = 'none';
    document.getElementById('searchInput').value = '';
}

function doSearchFromHome() {
    const query = document.getElementById('searchInput').value.trim();
    if (!query) { alert('Please enter a search term'); return; }
    location.hash = `#q=${encodeURIComponent(query)}`;
    showResults(1);
}

function doSearchFromResults() {
    const query = document.getElementById('resultSearchInput').value.trim();
    if (!query) { alert('Please enter a search term'); return; }
    location.hash = `#q=${encodeURIComponent(query)}`;
    showResults(1);
}

function showResults(page = 1) {
    detectLocale();
    currentPage = page;
    const hash = location.hash;
    const query = hash.startsWith('#q=') ? decodeURIComponent(hash.substring(3)) : '';

    if (!query) { goHome(); return; }

    document.getElementById('home').style.display = 'none';
    document.getElementById('results').style.display = 'block';
    document.getElementById('resultSearchInput').value = query;

    const start = (currentPage - 1) * resultsPerPage;
    const end = start + resultsPerPage;
    const pageResults = demoResults.slice(start, end);

    const container = document.getElementById('resultsContainer');
    const totalResults = (demoResults.length * 137500).toLocaleString();
    const searchTime = (Math.random() * 0.4 + 0.3).toFixed(2);
    
    container.innerHTML = `<div class="results-info">About ${totalResults} results (${searchTime} seconds)</div>`;
    
    pageResults.forEach(r => {
        const breadcrumb = r.url.replace('https://www.', '').replace('https://', '').split('/').slice(0, 2).join(' › ');
        container.innerHTML += `
            <div class="result-item">
                <div class="breadcrumb">${breadcrumb}</div>
                <h3><a href="${r.url}" target="_blank">${r.title}</a></h3>
                <div class="date">${r.date}</div>
                <p>${r.snippet}</p>
            </div>`;
    });

    renderPagination();
    window.scrollTo(0, 0);
}

function renderPagination() {
    const totalPages = Math.ceil(demoResults.length / resultsPerPage);
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';
    
    if (currentPage > 1) {
        pagination.innerHTML += `<a href="#" class="nav-arrow" onclick="showResults(${currentPage - 1}); return false;">&lt; Previous</a>`;
    }

    const startPage = Math.max(1, currentPage - 5);
    const endPage = Math.min(totalPages, currentPage + 4);

    for (let i = startPage; i <= endPage; i++) {
        if (i === currentPage) {
            pagination.innerHTML += `<span class="current">${i}</span>`;
        } else {
            pagination.innerHTML += `<a href="#" onclick="showResults(${i}); return false;">${i}</a>`;
        }
    }

    if (currentPage < totalPages) {
        pagination.innerHTML += `<a href="#" class="nav-arrow" onclick="showResults(${currentPage + 1}); return false;">Next &gt;</a>`;
    }
}

document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doSearchFromHome(); }
});

document.getElementById('resultSearchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doSearchFromResults(); }
});

window.addEventListener('load', () => {
    detectLocale();
    if (location.hash.startsWith('#q=')) showResults(1);
});

window.addEventListener('hashchange', () => {
    if (location.hash.startsWith('#q=')) {
        showResults(1);
    } else if (!location.hash) {
        goHome();
    }
});
</script>
</body>
</html>
